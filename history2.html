<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日本史 年号トレーニング</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f3f3f3;
    padding:40px;
}

#card{
    max-width:500px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

#event{
    font-size:28px;
    margin:30px 0;
}

input{
    font-size:32px;
    width:180px;
    text-align:center;
    padding:10px;
    border:none;
    border-radius:12px;
    outline:none;
    transition:0.2s;
}

button{
    margin-top:20px;
    padding:12px 24px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#message{
    margin-top:20px;
    font-size:22px;
}
</style>
</head>
<body>

<div id="card">

<h1>日本史 年号トレーニング</h1>

<div id="event"></div>

<input id="answer" maxlength="4">

<br>

<button onclick="submitAnswer()">回答</button>

<div id="message"></div>

</div>

<script>

// ===== ここに全部貼る =====

const allEvents = [
{name:"朝鮮戦争",year:1950},
{name:"警察予備隊",year:1950.1},
{name:"サンフランシスコ平和条約",year:1951},
{name:"日米安全保障条約",year:1951.1},
{name:"日本の主権回復",year:1952},
{name:"保安隊",year:1952.1},
{name:"自衛隊",year:1954},
{name:"アジア・アフリカ会議",year:1955},
{name:"自由民主党結成",year:1955.1},
{name:"55年体制",year:1955.2},
{name:"日ソ共同宣言",year:1956},
{name:"日本の国際連合加盟",year:1956.1},

{name:"日米安全保障条約改定",year:1960},
{name:"安保闘争",year:1960.1},
{name:"所得倍増計画",year:1960.2},
{name:"キューバ危機",year:1962},
{name:"東海道新幹線開通",year:1964},
{name:"東京オリンピック",year:1964.1},
{name:"日韓基本条約",year:1965},
{name:"ベトナム戦争",year:1965.1},
{name:"公害対策基本法",year:1967},
{name:"GNP世界第2位",year:1968},
{name:"環境庁発足",year:1971},

{name:"沖縄返還",year:1972},
{name:"日中共同声明",year:1972.1},
{name:"日中国交正常化",year:1972.2},
{name:"石油危機（オイルショック）",year:1973},
{name:"主要国首脳会議（サミット）",year:1975},
{name:"日中平和友好条約",year:1978},

{name:"バブル経済",year:1985},
{name:"ベルリンの壁崩壊",year:1989},
{name:"消費税導入",year:1989.1},
{name:"マルタ会談",year:1989.2},
{name:"東西ドイツ統一",year:1990},
{name:"ソ連解体",year:1991},
{name:"冷戦終結",year:1991.1},
{name:"湾岸戦争",year:1991.2},
{name:"PKO協力法",year:1992},
{name:"自衛隊のカンボジア派遣",year:1992.1},
{name:"阪神・淡路大震災",year:1995},
{name:"村山談話",year:1995.1},

{name:"同時多発テロ",year:2001},
{name:"アフガニスタン戦争",year:2001.1},
{name:"イラク戦争",year:2003},
{name:"自衛隊のイラク派遣",year:2003.1},

{name:"東日本大震災",year:2011},
{name:"福島第一原発事故",year:2011.1}
];

let current;

// 問題出す
function nextQuestion(){

    current = allEvents[
        Math.floor(Math.random()*allEvents.length)
    ];

    document.getElementById("event").textContent = current.name;

    document.getElementById("answer").value = "";

    document.getElementById("answer").style.background = "white";

    document.getElementById("message").textContent = "";
}


// 距離判定
function updateColor(){

    let input = document.getElementById("answer");

    let value = Number(input.value);

    if(!value){

        input.style.background = "white";

        return;
    }

    let diff = Math.abs(value - current.year);

    if(diff === 0){

        input.style.background = "#8cff8c"; // 緑
    }

    else if(diff <= 1){

        input.style.background = "#b8ff8c";
    }

    else if(diff <= 3){

        input.style.background = "#ffff8c";
    }

    else if(diff <= 10){

        input.style.background = "#ffd28c";
    }

    else if(diff <= 30){

        input.style.background = "#ffb18c";
    }

    else{

        input.style.background = "#ff8c8c"; // 赤
    }
}


// 回答
function submitAnswer(){

    let ans = Number(
        document.getElementById("answer").value
    );

    let message = document.getElementById("message");

    if(ans === current.year){

        message.textContent = "🎉 正解";

        setTimeout(nextQuestion,800);

    }else{

        message.textContent = "× まだ違う";
    }
}


const input = document.getElementById("answer");

input.addEventListener("input", updateColor);

input.addEventListener("keydown", function(e){

    if(e.key==="Enter"){

        submitAnswer();
    }
});

nextQuestion();

</script>

</body>
</html>
