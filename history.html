<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>日本史 時系列クイズ</title>

<style>

body{
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f3f3f3;
    padding: 20px;
    margin: 0;
}

h2{
    margin-bottom: 20px;
}

button{
    margin: 6px;
    padding: 10px 18px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    background: #ddd;
    cursor: pointer;
}

#quiz{
    max-height: 65vh;
    overflow: auto;
    margin-top: 20px;
}

.event{
    background: white;
    margin: 8px auto;
    width: 330px;
    max-width: 90%;
    padding: 14px;
    border: 2px solid gray;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
}

.selected{
    background: #bfe3ff;
    transform: scale(1.03);
    border: 2px solid #2b7cff;
}

.correct{
    background: #d8ffd8;
    border: 2px solid #33aa33;
}

.wrong{
    background: #ffd6d6;
    border: 2px solid #dd3333;
}

#result{
    margin-top: 25px;
    padding-bottom: 30px;
    font-size: 18px;
}

.answer{
    margin-top: 15px;
    font-size: 15px;
    line-height: 1.7;
}

</style>
</head>
<body>

<h2>日本史 時系列クイズ</h2>

<button onclick="generateRandom()">通常(5問)</button>
<button onclick="generateAll()">全部モード</button>
<button onclick="checkAnswer()">答え合わせ</button>

<div id="quiz"></div>
<div id="result"></div>

<script>

const events = [
{name:"朝鮮戦争",year:1950},
{name:"警察予備隊",year:1950.1},
{name:"サンフランシスコ平和条約",year:1951},
{name:"日米安全保障条約",year:1951.1},
{name:"日本の主権回復",year:1952},
{name:"保安隊",year:1952.1},
{name:"自衛隊",year:1954},
{name:"アジア・アフリカ会議",year:1955},
{name:"自由民主党結成",year:1955.1},
{name:"55年体制",year:1955.2},
{name:"日ソ共同宣言",year:1956},
{name:"日本の国際連合加盟",year:1956.1},

{name:"日米安全保障条約改定",year:1960},
{name:"安保闘争",year:1960.1},
{name:"所得倍増計画",year:1960.2},
{name:"キューバ危機",year:1962},
{name:"東海道新幹線開通",year:1964},
{name:"東京オリンピック",year:1964.1},
{name:"日韓基本条約",year:1965},
{name:"ベトナム戦争",year:1965.1},
{name:"公害対策基本法",year:1967},
{name:"GNP世界第2位",year:1968},
{name:"環境庁発足",year:1971},

{name:"沖縄返還",year:1972},
{name:"日中共同声明",year:1972.1},
{name:"日中国交正常化",year:1972.2},
{name:"石油危機（オイルショック）",year:1973},
{name:"主要国首脳会議（サミット）",year:1975},
{name:"日中平和友好条約",year:1978},

{name:"バブル経済",year:1985},
{name:"ベルリンの壁崩壊",year:1989},
{name:"消費税導入",year:1989.1},
{name:"マルタ会談",year:1989.2},
{name:"東西ドイツ統一",year:1990},
{name:"ソ連解体",year:1991},
{name:"冷戦終結",year:1991.1},
{name:"湾岸戦争",year:1991.2},
{name:"PKO協力法",year:1992},
{name:"自衛隊のカンボジア派遣",year:1992.1},
{name:"阪神・淡路大震災",year:1995},
{name:"村山談話",year:1995.1},

{name:"同時多発テロ",year:2001},
{name:"アフガニスタン戦争",year:2001.1},
{name:"イラク戦争",year:2003},
{name:"自衛隊のイラク派遣",year:2003.1},

{name:"東日本大震災",year:2011},
{name:"福島第一原発事故",year:2011.1}
];

let current = [];
let selected = null;

function shuffle(arr){
    return arr.sort(() => Math.random() - 0.5);
}

function resetSelection(){

    if(selected){
        selected.classList.remove("selected");
    }

    selected = null;
}

function clearColors(){

    document.querySelectorAll(".event").forEach(el => {
        el.classList.remove("correct");
        el.classList.remove("wrong");
    });
}

function render(list){

    resetSelection();
    clearColors();

    document.getElementById("result").innerHTML = "";

    current = list;

    let display = shuffle([...list]);

    let quiz = document.getElementById("quiz");
    quiz.innerHTML = "";

    display.forEach(e => {

        let div = document.createElement("div");

        div.className = "event";
        div.innerText = e.name;
        div.dataset.year = e.year;

        div.onclick = function(){
            choose(this);
        };

        quiz.appendChild(div);
    });
}

function generateRandom(){
    let list = shuffle([...events]).slice(0,5);
    render(list);
}

function generateAll(){
    render([...events]);
}

function choose(item){

    clearColors();

    if(selected === null){

        selected = item;
        item.classList.add("selected");
        return;
    }

    if(selected === item){

        item.classList.remove("selected");
        selected = null;
        return;
    }

    // 入れ替え
    let tempText = selected.innerText;
    let tempYear = selected.dataset.year;

    selected.innerText = item.innerText;
    selected.dataset.year = item.dataset.year;

    item.innerText = tempText;
    item.dataset.year = tempYear;

    selected.classList.remove("selected");
    selected = null;
}

function checkAnswer(){

    resetSelection();
    clearColors();

    let items = [...document.querySelectorAll(".event")];

    let userOrder = items.map(i => parseFloat(i.dataset.year));

    let correctEvents = [...current].sort((a,b)=>a.year-b.year);

    let correct = true;

    for(let i=0;i<items.length;i++){

        if(userOrder[i] === correctEvents[i].year){

            items[i].classList.add("correct");

        }else{

            items[i].classList.add("wrong");
            correct = false;
        }
    }

    let result = document.getElementById("result");

    if(correct){

        result.innerHTML = "✅ 完全正解！";

    }else{

        let answer = correctEvents
            .map(e => e.name)
            .join(" → ");

        result.innerHTML = `
        ❌ 不正解
        <div class="answer">
        正しい順番:<br><br>
        ${answer}
        </div>
        `;
    }
}

generateRandom();

</script>

</body>
</html>
